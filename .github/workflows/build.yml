# Windows build: tests, afterm.exe and the MSI/NSIS installers.
#
# Run it by hand from the Actions tab (Build > Run workflow). Fill in "Release
# tag" (e.g. v1.0.1) to publish a GitHub Release from the run, or push that
# tag instead; either way the full build runs and its files go on the release.
#
# Signing goes through SignPath when the repository is configured for it; see
# .signpath/README.md. Unconfigured, everything builds unsigned.
name: Build

on:
  workflow_dispatch:
    inputs:
      release:
        description: Release tag to publish, e.g. v1.0.1 (blank for a test build)
        type: string
        default: ""
      build_installers:
        # Tauri embeds the frontend in afterm.exe, so the executable alone is
        # a complete app. Off skips WiX/NSIS packaging and finishes sooner.
        description: Build MSI and NSIS installers
        type: boolean
        default: true
      run_tests:
        description: Run the native backend tests
        type: boolean
        default: true
      sign:
        description: Sign with SignPath (releases are always signed once configured)
        type: boolean
        default: false
  push:
    tags: ["v*"]

concurrency:
  group: build-${{ github.ref }}-${{ inputs.release }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release }}
  # A release always gets the full, tested build.
  BUILD_INSTALLERS: ${{ github.event_name == 'push' || inputs.release != '' || inputs.build_installers }}
  RUN_TESTS: ${{ github.event_name == 'push' || inputs.release != '' || inputs.run_tests }}
  SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && (github.event_name == 'push' || inputs.release != '' || inputs.sign) }}

jobs:
  windows:
    runs-on: windows-2025
    permissions:
      contents: write   # to create the tag and release; nothing else writes
    steps:
      - uses: actions/checkout@v4

      # A release named for a different version than the one being built would
      # ship installers that disagree with their own release page.
      - name: Check the release tag matches the version
        if: env.RELEASE_TAG != ''
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Release tag $env:RELEASE_TAG does not match tauri.conf.json version $version (expected v$version)."
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # npm's download cache, not node_modules: `npm ci` deletes that.
          cache: npm

      - name: Configure stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable-msvc --profile minimal
          rustup default stable-msvc
          rustc --version
          cargo --version

      # The Rust dependency tree is most of the build time. Keyed on the lock
      # file and the manifest (a profile change invalidates the target dir
      # without touching Cargo.lock), not on the sources, so the exact key hits
      # from the second run on and only afterm's own crate recompiles.
      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ hashFiles('src-tauri/Cargo.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test

      # Types only; Tauri's beforeBuildCommand builds the bundle itself.
      - name: Type-check frontend
        run: npx tsc --noEmit

      # In the release profile on purpose: the tests warm the exact artifacts
      # the build then reuses.
      - name: Test native backend
        if: env.RUN_TESTS == 'true'
        run: cargo test --release --manifest-path src-tauri/Cargo.toml

      # WiX and NSIS write into target/release/bundle, which the restored cache
      # carries and neither tool cleans, so installers from an older version
      # would ship beside this run's.
      - name: Clear installers from the restored cache
        shell: pwsh
        run: |
          $bundle = "src-tauri/target/release/bundle"
          if (Test-Path $bundle) { Remove-Item -Recurse -Force $bundle }

      # The executable first, on its own, so that it can be signed before the
      # installers are made from it: the installed afterm.exe is then signed
      # too, not just the setup program that put it there.
      - name: Build afterm.exe
        run: npm run tauri build -- --no-bundle

      # ---- Sign the executable (SignPath) ------------------------------------
      - name: Stage afterm.exe for signing
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force signing/exe | Out-Null
          Copy-Item src-tauri/target/release/afterm.exe signing/exe/

      - name: Upload unsigned afterm.exe
        if: env.SIGN == 'true'
        id: unsigned-exe
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exe
          path: signing/exe/afterm.exe
          if-no-files-found: error

      - name: Sign afterm.exe
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: exe
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          # Long enough for someone to approve a release request.
          wait-for-completion-timeout-in-seconds: 14400
          output-artifact-directory: signing/exe-signed

      - name: Use the signed afterm.exe
        if: env.SIGN == 'true'
        shell: pwsh
        run: Copy-Item signing/exe-signed/afterm.exe src-tauri/target/release/afterm.exe -Force

      # ---- Installers --------------------------------------------------------
      - name: Build MSI and NSIS installers
        if: env.BUILD_INSTALLERS == 'true'
        run: npm run tauri bundle

      # Everything this run publishes, under its final names, in out/.
      - name: Collect the build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/afterm.exe out/
          if ($env:BUILD_INSTALLERS -eq 'true') {
            $msi = @(Get-ChildItem src-tauri/target/release/bundle/msi/*.msi)
            $nsis = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe)
            if ($msi.Count -ne 1 -or $nsis.Count -ne 1) {
              throw "Expected one MSI and one setup program, found $($msi.Count) and $($nsis.Count)."
            }
            Copy-Item $msi[0], $nsis[0] out/
            "MSI_NAME=$($msi[0].Name)" >> $env:GITHUB_ENV
            "NSIS_NAME=$($nsis[0].Name)" >> $env:GITHUB_ENV
          }

      # ---- Sign the installers (SignPath) ------------------------------------
      # Fixed names going in, so the artifact configuration can name them; the
      # versioned names come back afterwards.
      - name: Stage installers for signing
        if: env.SIGN == 'true' && env.BUILD_INSTALLERS == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force signing/installers | Out-Null
          Copy-Item "out/$env:MSI_NAME" signing/installers/afterm.msi
          Copy-Item "out/$env:NSIS_NAME" signing/installers/afterm-setup.exe

      - name: Upload unsigned installers
        if: env.SIGN == 'true' && env.BUILD_INSTALLERS == 'true'
        id: unsigned-installers
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installers
          path: signing/installers/
          if-no-files-found: error

      - name: Sign installers
        if: env.SIGN == 'true' && env.BUILD_INSTALLERS == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installers
          github-artifact-id: ${{ steps.unsigned-installers.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 14400
          output-artifact-directory: signing/installers-signed

      - name: Use the signed installers
        if: env.SIGN == 'true' && env.BUILD_INSTALLERS == 'true'
        shell: pwsh
        run: |
          Copy-Item signing/installers-signed/afterm.msi "out/$env:MSI_NAME" -Force
          Copy-Item signing/installers-signed/afterm-setup.exe "out/$env:NSIS_NAME" -Force

      # ---- Publish -----------------------------------------------------------
      # Replacing this one file updates an existing installation.
      - name: Publish afterm.exe
        uses: actions/upload-artifact@v4
        with:
          name: afterm-exe
          path: out/afterm.exe
          if-no-files-found: error

      - name: Publish MSI and NSIS installers
        if: env.BUILD_INSTALLERS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: afterm-windows
          path: |
            out/*.msi
            out/*-setup.exe
          if-no-files-found: error

      # Creates the tag at this commit when the run was started by hand.
      - name: Publish GitHub Release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: afterm ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            out/afterm.exe
            out/*.msi
            out/*-setup.exe
