# Windows build: tests, afterm.exe and the MSI/NSIS installers.
#
# The GitHub counterpart of azure-pipelines.yml, with the same two switches.
# Run it by hand from the Actions tab (Build > Run workflow), or push a tag
# like `v1.0.1` to build everything and attach it to a GitHub Release.
name: Build

on:
  workflow_dispatch:
    inputs:
      build_installers:
        # Tauri embeds the frontend in afterm.exe, so the executable alone is
        # a complete app. Off skips WiX/NSIS packaging and finishes sooner.
        description: Build MSI and NSIS installers
        type: boolean
        default: true
      run_tests:
        # The release profile's test binary gets its own link; off is the
        # fast lane.
        description: Run the native backend tests
        type: boolean
        default: true
  push:
    tags: ["v*"]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A tag push has no inputs; it gets the full build.
  BUILD_INSTALLERS: ${{ github.event_name == 'push' || inputs.build_installers }}
  RUN_TESTS: ${{ github.event_name == 'push' || inputs.run_tests }}

jobs:
  windows:
    runs-on: windows-2025
    permissions:
      contents: write   # only used to create the release on a tag push
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # npm's download cache, not node_modules: `npm ci` deletes that.
          cache: npm

      - name: Configure stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable-msvc --profile minimal
          rustup default stable-msvc
          rustc --version
          cargo --version

      # The Rust dependency tree is most of the build time. Keyed on the lock
      # file and the manifest (a profile change invalidates the target dir
      # without touching Cargo.lock), not on the sources, so the exact key hits
      # from the second run on and only afterm's own crate recompiles.
      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ hashFiles('src-tauri/Cargo.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test

      # Types only; Tauri's beforeBuildCommand builds the bundle itself.
      - name: Type-check frontend
        run: npx tsc --noEmit

      # In the release profile on purpose: the tests warm the exact artifacts
      # the build then reuses.
      - name: Test native backend
        if: env.RUN_TESTS == 'true'
        run: cargo test --release --manifest-path src-tauri/Cargo.toml

      # WiX and NSIS write into target/release/bundle, which the restored cache
      # carries and neither tool cleans, so installers from an older version
      # would ship beside this run's. Packaging is not incremental, so the
      # directory costs nothing to throw away.
      - name: Clear installers from the restored cache
        if: env.BUILD_INSTALLERS == 'true'
        shell: pwsh
        run: |
          $bundle = "src-tauri/target/release/bundle"
          if (Test-Path $bundle) { Remove-Item -Recurse -Force $bundle }

      - name: Build app and installers
        if: env.BUILD_INSTALLERS == 'true'
        run: npm run tauri build

      - name: Build app only (no installers)
        if: env.BUILD_INSTALLERS != 'true'
        run: npm run tauri build -- --no-bundle

      # Replacing this one file updates an existing installation.
      - name: Publish afterm.exe
        uses: actions/upload-artifact@v4
        with:
          name: afterm-exe
          path: src-tauri/target/release/afterm.exe
          if-no-files-found: error

      - name: Publish MSI and NSIS installers
        if: env.BUILD_INSTALLERS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: afterm-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/afterm.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
